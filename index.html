<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LHP Pabrik Teh</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c5d3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LHP Teh">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--hijau:#1c5d3c;--emas:#d8b24a;--krem:#fffefa;--latar:#f6f5ec}
@media (prefers-color-scheme:dark){:root{--latar:#0b1a12}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--latar);overflow:hidden}
/* ruang aman (poni / bilah sistem) ditangani cangkang karena env() tidak diteruskan ke iframe */
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{display:block;width:100%;height:100%;border:0;background:var(--latar)}
/* layar pembuka */
#spl{position:fixed;inset:0;z-index:20;background:var(--hijau);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .35s}
#spl.off{opacity:0;pointer-events:none}
#spl img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 28px #0006}
#spl b{font-size:18px;letter-spacing:.02em}
#spl .bar{width:180px;height:4px;border-radius:4px;background:#ffffff33;overflow:hidden}
#spl .bar i{display:block;width:40%;height:100%;background:var(--emas);animation:geser 1.1s linear infinite}
@keyframes geser{0%{margin-left:-40%}100%{margin-left:100%}}
#msg{min-height:20px;max-width:300px;text-align:center;color:#d7e6dc;font-size:13px}
/* tombol & pesan */
.btn{position:fixed;z-index:30;border:1px solid var(--emas);background:var(--hijau);color:#fff;border-radius:999px;padding:8px 14px;font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;box-shadow:0 4px 14px #0005;text-decoration:none}
#ins{right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom))}
#bantu{left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));background:#fffefa;color:#1c5d3c}
#off{position:fixed;left:0;right:0;top:0;z-index:40;background:#7a1f1f;color:#fff;text-align:center;font:13px system-ui,sans-serif;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top))}
#ios{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;background:#fffefa;color:#14291e;border:1px solid var(--emas);border-radius:12px;padding:10px 12px;font:13px/1.4 system-ui,sans-serif;box-shadow:0 6px 20px #0005}
[hidden]{display:none !important}
</style>
</head>
<body>

<div id="spl" role="status" aria-live="polite">
  <img src="icons/icon-192.png" alt="" width="96" height="96">
  <b>LHP Pabrik Teh</b>
  <div class="bar"><i></i></div>
  <div id="msg">Memuat aplikasi…</div>
</div>

<iframe id="app" title="LHP Pabrik Teh" allow="fullscreen"></iframe>

<div id="off" hidden>Tidak ada koneksi internet. Data akan dimuat setelah tersambung kembali.</div>
<button id="ins" class="btn" type="button" hidden>Pasang aplikasi</button>
<a id="bantu" class="btn" href="#" target="_blank" rel="noopener" hidden>Tidak tampil? Buka langsung</a>
<div id="ios" hidden>Di iPhone/iPad: ketuk <b>Bagikan</b>, lalu <b>Tambah ke Layar Utama</b>. <a href="#" id="iosx">Tutup</a></div>

<script>
/* ================== PENGATURAN (ubah hanya bagian ini) ==================
   Isi dengan alamat web app Apps Script yang berakhiran /exec
   (Deploy > Manage deployments > Web app > URL).                           */
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfAutFo8R97OJaZA423d9Gkg7Jv5ZXuSA1RRyVCDbNjKMXHB0aLY0OLnmevC3reGCt/exec";
var BANTU_SETELAH_DETIK = 15;     /* tombol "Buka langsung" muncul bila layar pembuka belum hilang */
var PESAN_LAMBAT_DETIK = 8;       /* pesan "server sedang dibangunkan" */
/* ===================================================================== */

(function () {
  var $ = function (i) { return document.getElementById(i); };
  var ok = /^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(APPS_SCRIPT_URL);
  var frame = $("app"), spl = $("spl"), msg = $("msg"), mulai = Date.now(), selesai = false;

  function standalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function tutupSplash() {
    if (selesai) return; selesai = true;
    var sisa = Math.max(0, 500 - (Date.now() - mulai));      /* tampil minimal 0,5 detik agar tidak berkedip */
    setTimeout(function () { spl.classList.add("off"); $("bantu").hidden = true; }, sisa);
  }

  if (!ok) {
    msg.textContent = "Alamat Apps Script belum diatur. Buka index.html lalu isi APPS_SCRIPT_URL.";
  } else {
    $("bantu").href = APPS_SCRIPT_URL;
    frame.addEventListener("load", tutupSplash);
    frame.src = APPS_SCRIPT_URL;
    setTimeout(function () { if (!selesai) msg.textContent = "Server sedang dibangunkan. Kunjungan pertama setelah lama tidak dibuka bisa sampai 30 detik."; }, PESAN_LAMBAT_DETIK * 1000);
    setTimeout(function () { if (!selesai) $("bantu").hidden = false; }, BANTU_SETELAH_DETIK * 1000);
    setTimeout(tutupSplash, 45000);                          /* jaring pengaman: jangan menutup layar selamanya */
  }

  /* koneksi */
  function koneksi() { $("off").hidden = navigator.onLine; }
  window.addEventListener("online", function () { koneksi(); if (ok && selesai) { /* data dimuat ulang oleh aplikasi saat dipakai lagi */ } });
  window.addEventListener("offline", koneksi); koneksi();

  /* tombol Pasang aplikasi (Chrome / Edge / Android) */
  var tunda = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); tunda = e; if (!standalone()) $("ins").hidden = false;
  });
  $("ins").addEventListener("click", function () {
    if (!tunda) return; tunda.prompt();
    tunda.userChoice.then(function () { tunda = null; $("ins").hidden = true; });
  });
  window.addEventListener("appinstalled", function () { $("ins").hidden = true; });

  /* iPhone/iPad: tidak ada tombol pasang otomatis, tampilkan petunjuk satu kali */
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (ios && !standalone()) {
    var sudah = false; try { sudah = localStorage.getItem("ios_tips") === "1"; } catch (e) {}
    if (!sudah) { $("ios").hidden = false; }
    $("iosx").addEventListener("click", function (e) { e.preventDefault(); $("ios").hidden = true; try { localStorage.setItem("ios_tips", "1"); } catch (x) {} });
  }

  /* service worker (hanya menyimpan cangkang ini, bukan data aplikasi) */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
